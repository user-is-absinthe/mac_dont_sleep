name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build universal app
        run: ./build_app.command

      - name: Package DMG
        run: ./scripts/make_dmg.sh "build/DontSleep-${GITHUB_REF_NAME}.dmg"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n\n```zsh\nsudo xattr -cr "%s"\n```\n' \
            "После установки снимите карантин Gatekeeper (скопируйте команду целиком):" \
            "/Applications/Don't sleep.app" \
            > /tmp/notes.md
          gh release create "$GITHUB_REF_NAME" \
            "build/DontSleep-${GITHUB_REF_NAME}.dmg" \
            --title "Don't sleep ${GITHUB_REF_NAME}" \
            --notes-file /tmp/notes.md \
            --generate-notes